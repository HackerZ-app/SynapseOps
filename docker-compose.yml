version: '3.8'

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: synapse-falkordb
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  synapse-ops:
    build: .
    container_name: synapse-ops-app
    ports:
      - "3000:3000"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
    depends_on:
      falkordb:
        condition: service_healthy

volumes:
  falkordb_data:
    driver: local
